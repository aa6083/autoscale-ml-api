<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoScale ML Inference API</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #1a1a2e;
      border: 1px solid #2d2d5e;
      border-radius: 16px;
      padding: 48px;
      width: 600px;
      box-shadow: 0 0 40px rgba(99,102,241,0.15);
    }
    h1 {
      font-size: 1.8rem;
      color: #818cf8;
      margin-bottom: 8px;
    }
    p.sub {
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 0.9rem;
    }
    textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2d2d5e;
      border-radius: 10px;
      padding: 16px;
      color: #fff;
      font-size: 1rem;
      resize: vertical;
      min-height: 120px;
      outline: none;
    }
    textarea:focus { border-color: #818cf8; }
    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    .result {
      margin-top: 28px;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    .positive { background: rgba(16,185,129,0.1); border: 1px solid #10b981; }
    .negative { background: rgba(239,68,68,0.1); border: 1px solid #ef4444; }
    .label {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .positive .label { color: #10b981; }
    .negative .label { color: #ef4444; }
    .confidence { color: #9ca3af; font-size: 0.95rem; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .positive .badge { background: #10b981; color: #fff; }
    .negative .badge { background: #ef4444; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 ML Sentiment Analyzer</h1>
    <p class="sub">Deployed on AWS via Jenkins + Terraform + Docker</p>

    <form method="post" action="/analyze">
      <textarea name="text" placeholder="Type any text here... (e.g. This product is amazing!)">{{ input_text or '' }}</textarea>
      <button type="submit">Analyze Sentiment</button>
    </form>

    {% if result %}
    <div class="result {{ result.label | lower }}">
      <span class="badge">RESULT</span>
      <div class="label">
        {% if result.label == "POSITIVE" %} 😊 POSITIVE
        {% else %} 😞 NEGATIVE {% endif %}
      </div>
      <div class="confidence">Confidence: {{ result.confidence }}%</div>
    </div>
    {% endif %}
  </div>
</body>
</html>
